# ===== Docker Compose =====
# Runs PostgreSQL and Redis for local development.
# Usage: docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: ocj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocj_user
      POSTGRES_PASSWORD: ocj_password
      POSTGRES_DB: online_code_judge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocj_user -d online_code_judge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ocj-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
